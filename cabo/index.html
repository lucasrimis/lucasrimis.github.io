<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cabo (chechuda) — jogo de cartas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Tilt+Neon&display=swap" rel="stylesheet">
<style>
  /*
    VOICE: a friendly evening card table, same house as LuMa.
    IDEA: a real Cabo table: four face-down cards each, a deck, a discard pile and a loud "CABO!".
    PICTURE: the table itself, dalmatian card backs, cards that fly, peek and swap.
    COLOUR and TYPE: deep violet night, value-coloured faces, yellow accent; Fredoka + Tilt Neon.
    LAYOUT: opponents on top, piles in the middle, your hand below, score and log at the side.
  */
  :root{
    --bg1:#101a33; --bg2:#2b1d4f; --panel:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
    --text:#eef0ff; --muted:#a9b0d6; --accent:#ffd166; --cabo:#ff4d6d;
    --zero:#22a6c7; --low:#2fae66; --mid:#e9a923; --peek:#6c5ce7; --spy:#2f7fe0; --swap:#e07a2f; --high:#e1523d;
    --cw:clamp(56px, 16vw, 82px);
    --ow:clamp(30px, 8vw, 44px);
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;min-height:100%}
  body{font-family:'Fredoka',system-ui,sans-serif;color:var(--text);
    background:radial-gradient(1200px 700px at 20% -10%, #3a2c6e 0%, transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg2));
    min-height:100vh;overflow-x:clip}
  button{font-family:inherit;cursor:pointer}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.5px}
  header h1 span{color:var(--accent)}
  .hbtns{display:flex;gap:8px;flex-wrap:wrap}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:10px;font-size:14px;min-height:36px}
  .btn:hover{background:rgba(255,255,255,.12)}
  .btn:focus-visible,.choice:focus-visible,.card.pick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  select.btn{appearance:none;-webkit-appearance:none;padding-right:12px}
  select.btn option{color:#111;background:#fff}
  .btn.primary{background:var(--accent);color:#2a1d10;border-color:transparent;font-weight:600}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.cabo{background:var(--cabo);color:#fff;border-color:transparent;font-weight:700;letter-spacing:.08em;font-size:16px;padding:8px 18px;
    box-shadow:0 0 0 3px rgba(255,77,109,.25), 0 4px 14px rgba(255,77,109,.35)}
  .btn.on{border-color:var(--accent);background:rgba(255,209,102,.16)}
  main{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:16px;padding:16px;max-width:1150px;margin:0 auto}
  @media (max-width:820px){main{grid-template-columns:minmax(0,1fr)}}

  /* setup */
  .choices{display:flex;gap:10px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
  .choice{padding:10px 16px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--text);font-size:16px;min-width:44px;min-height:44px}
  .choice.on{border-color:var(--accent);background:rgba(255,209,102,.12)}

  /* board */
  #opps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
  .opp{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;transition:box-shadow .2s,border-color .2s}
  .opp.turn,.mine.turn{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,209,102,.35)}
  .opp.target{border-color:#9fd3ff;box-shadow:0 0 0 2px rgba(159,211,255,.35)}
  .pname{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:600;margin-bottom:8px;font-size:15px}
  .pname small{color:var(--muted);font-weight:400}
  .badge{font-size:11px;font-weight:700;letter-spacing:.08em;background:var(--cabo);color:#fff;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}
  .grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .opp .grid .card{width:var(--ow);height:calc(var(--ow)*1.4);font-size:calc(var(--ow)*.5);border-radius:6px}
  .card{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-weight:700;font-size:calc(var(--cw)*.46);color:#fff;position:relative;user-select:none;line-height:1;
    box-shadow:0 2px 0 rgba(0,0,0,.25), inset 0 0 0 2px rgba(255,255,255,.18);transition:transform .15s, box-shadow .15s}
  .card .pw{font-size:.24em;font-weight:600;letter-spacing:.02em;margin-top:.25em;opacity:.92;text-transform:lowercase}
  /* dalmatian-spotted card back, same as LuMa */
  .card.back{
    background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20140%27%20preserveAspectRatio%3D%27none%27%3E%3Cg%20fill%3D%27%23141414%27%3E%3Cpath%20d%3D%27M28.4%2C13.0Q27.6%2C16.0%2027.2%2C19.1Q26.8%2C22.1%2024.2%2C23.5Q21.6%2C24.8%2019.0%2C23.3Q16.4%2C21.7%2014.9%2C20.0Q13.5%2C18.2%2013.8%2C16.0Q14.2%2C13.7%2014.5%2C11.2Q14.8%2C8.7%2018.0%2C9.0Q21.2%2C9.2%2025.2%2C9.6Q29.2%2C10.0%2028.4%2C13.0Z%27/%3E%3Cpath%20d%3D%27M69.3%2C9.1Q70.3%2C10.0%2069.9%2C11.6Q69.5%2C13.2%2068.2%2C13.9Q66.8%2C14.6%2065.7%2C13.7Q64.5%2C12.7%2063.3%2C11.9Q62.0%2C11.2%2062.3%2C10.0Q62.6%2C8.9%2063.2%2C7.6Q63.8%2C6.4%2065.2%2C6.2Q66.6%2C6.1%2067.4%2C7.1Q68.2%2C8.1%2069.3%2C9.1Z%27/%3E%3Cpath%20d%3D%27M93.0%2C33.9Q94.1%2C36.0%2092.7%2C38.0Q91.3%2C39.9%2089.2%2C41.2Q87.2%2C42.5%2084.2%2C42.7Q81.3%2C42.9%2080.6%2C40.4Q79.8%2C38.0%2078.8%2C35.8Q77.9%2C33.6%2080.0%2C31.5Q82.1%2C29.3%2084.8%2C28.4Q87.4%2C27.5%2089.7%2C29.6Q92.0%2C31.8%2093.0%2C33.9Z%27/%3E%3Cpath%20d%3D%27M46.7%2C31.2Q47.0%2C32.0%2046.6%2C32.8Q46.3%2C33.6%2045.5%2C34.7Q44.8%2C35.9%2043.3%2C35.7Q41.9%2C35.6%2040.9%2C34.4Q39.9%2C33.3%2040.2%2C32.0Q40.4%2C30.8%2040.9%2C29.6Q41.4%2C28.5%2043.0%2C28.6Q44.7%2C28.7%2045.5%2C29.5Q46.3%2C30.4%2046.7%2C31.2Z%27/%3E%3Cpath%20d%3D%27M63.9%2C61.6Q67.7%2C64.0%2065.3%2C67.7Q62.9%2C71.4%2059.4%2C72.2Q55.8%2C73.0%2053.0%2C71.6Q50.1%2C70.2%2048.5%2C68.4Q46.9%2C66.7%2046.3%2C64.1Q45.7%2C61.5%2047.9%2C59.4Q50.1%2C57.3%2053.1%2C56.2Q56.0%2C55.0%2058.1%2C57.1Q60.2%2C59.2%2063.9%2C61.6Z%27/%3E%3Cpath%20d%3D%27M18.6%2C56.9Q20.3%2C58.0%2019.9%2C59.8Q19.5%2C61.7%2017.1%2C61.9Q14.8%2C62.2%2013.0%2C62.0Q11.2%2C61.9%209.8%2C61.0Q8.5%2C60.1%209.4%2C58.4Q10.3%2C56.6%2011.0%2C55.5Q11.7%2C54.4%2013.3%2C53.7Q14.9%2C53.0%2015.9%2C54.4Q16.9%2C55.7%2018.6%2C56.9Z%27/%3E%3Cpath%20d%3D%27M36.3%2C85.3Q37.1%2C86.0%2037.2%2C87.2Q37.3%2C88.4%2035.9%2C88.6Q34.6%2C88.9%2033.6%2C88.8Q32.5%2C88.8%2031.2%2C88.0Q29.9%2C87.2%2029.9%2C86.0Q29.9%2C84.8%2031.2%2C84.2Q32.5%2C8 5%2C61.7%2095.3%2C62.1Q96.1%2C62.4%2096.5%2C63.2Z%27/%3E%3Cpath%20d%3D%27M41.5%2C45.5Q41.8%2C46.0%2041.6%2C46.6Q41.4%2C47.2%2040.9%2C47.3Q40.3%2C47.4%2039.7%2C47.4Q39.1%2C47.4%2038.4%2C47.1Q37.7%2C46.8%2037.9%2C46.1Q38.2%2C45.4%2038.5%2C44.8Q38.8%2C44.3%2039.5%2C44.4Q40.3%2C44.5%2040.8%2C44.7Q41.3%2C44.9%2041.5%2C45.5Z%27/%3E%3Cpath%20d%3D%27M32.4%2C129.1Q32.7%2C130.0%2032.4%2C130.7Q32.0%2C131.4%2031.3%2C132.0Q30.5%2C132.6%2029.6%2C132.3Q28.7%2C132.0%2028.2%2C131.4Q27.6%2C130.7%2027.7%2C130.0Q27.8%2C129.3%2028.2%2C128.7Q28.6%2C128.2%2029.6%2C127.9Q30.5%2C127.7%2031.3%2C128.0Q32.1%2C128.3%2032.4%2C129.1Z%27/%3E%3Cpath%20d%3D%27M72.5%2C43.2Q72.6%2C44.0%2072.1%2C44.7Q71.7%2C45.5%2071.0%2C45.5Q70.3%2C45.5%2069.8%2C45.4Q69.3%2C45.3%2068.8%2C44.9Q68.4%2C44.5%2067.8%2C43.9Q67.3%2C43.2%2068.2%2C42.9Q69.1%2C42.6%2069.7%2C42.3Q70.4%2C41.9%2071.3%2C42.2Q72.3%2C42.5%2072.5%2C43.2Z%27/%3E%3C/g%3E%3C/svg%3E") center/100% 100% no-repeat, linear-gradient(160deg,#ffffff,#ecebe6);
    box-shadow:0 2px 0 rgba(0,0,0,.25), inset 0 0 0 2px rgba(0,0,0,.12);}
  .card.gone{background:transparent;box-shadow:none;border:2px dashed rgba(255,255,255,.12)}
  .card.zero{background:linear-gradient(160deg,#47c4e0,var(--zero))}
  .card.low{background:linear-gradient(160deg,#4fca85,var(--low))}
  .card.mid{background:linear-gradient(160deg,#f6c34f,var(--mid));color:#3a2a05}
  .card.peek{background:linear-gradient(160deg,#8a7cf0,var(--peek))}
  .card.spy{background:linear-gradient(160deg,#5fa4f2,var(--spy))}
  .card.swap{background:linear-gradient(160deg,#f4a05f,var(--swap))}
  .card.high{background:linear-gradient(160deg,#f2735f,var(--high))}
  .card.pick{cursor:pointer;box-shadow:0 0 0 3px var(--accent), 0 4px 10px rgba(0,0,0,.3)}
  .card.pick:hover{transform:translateY(-4px)}
  .card.sel{transform:translateY(-6px);box-shadow:0 0 0 3px #fff, 0 0 0 6px var(--accent), 0 6px 14px rgba(0,0,0,.35)}
  .card.glow{animation:glow .9s ease-in-out infinite alternate}
  @keyframes glow{from{box-shadow:0 0 0 2px #9fd3ff, 0 0 8px #9fd3ff}to{box-shadow:0 0 0 3px #fff, 0 0 22px #9fd3ff;transform:translateY(-3px)}}
  .card.mem{box-shadow:0 0 0 3px #fff, 0 0 18px rgba(255,209,102,.7)}
  .card.ghost{background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
  .card.fly{position:fixed;margin:0;transition:none;will-change:transform;
    box-shadow:0 16px 32px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.2)}

  #table{display:flex;justify-content:center;align-items:flex-end;gap:22px;margin:18px 0 10px;flex-wrap:wrap}
  .pile{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:13px}
  .pile .count{font-size:12px}
  .slot-empty{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:10px;border:2px dashed rgba(255,255,255,.2)}
  #heldWrap .card{transform:rotate(-4deg)}
  #msg{text-align:center;min-height:26px;font-size:17px;margin:4px 0 8px;color:var(--accent);text-wrap:balance}
  #acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:44px;margin-bottom:10px}
  .mine{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
  .mine .grid{gap:10px}
  .mine .pname{justify-content:center;gap:12px}

  aside{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;align-self:start}
  aside h3{margin:0 0 10px;font-size:16px}
  .srow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}
  .srow .tot{font-weight:700}
  .srow small{color:var(--muted);font-weight:400;margin-left:4px}
  .bar{height:5px;background:rgba(255,255,255,.1);border-radius:3px;margin:2px 0 6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent)}
  #log{margin-top:14px;font-size:13px;color:var(--muted);max-height:240px;overflow:auto}
  #log div{padding:3px 0;border-top:1px solid rgba(255,255,255,.05)}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(8,10,25,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
  .box{background:#1e1a3d;border:1px solid var(--line);border-radius:18px;padding:22px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
  .box h2{margin:0 0 12px}
  .box table{width:100%;border-collapse:collapse;margin-bottom:16px}
  .box td,.box th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
  .box th{color:var(--muted);font-weight:500}
  .box .num{text-align:right;white-space:nowrap}
  .box ul{padding-left:20px;line-height:1.5;color:#dfe2ff}
  .box li{margin-bottom:4px}
  .tag{font-size:12px;background:var(--high);padding:1px 6px;border-radius:6px;margin-left:4px;white-space:nowrap}
  .tag.ok{background:var(--low)}
  .tag.info{background:var(--spy)}

  /* finale (same as LuMa) */
  #finale{position:fixed;inset:0;z-index:40;display:none;overflow:hidden}
  #finale.on{display:block;animation:finIn .5s ease}
  @keyframes finIn{from{opacity:0}to{opacity:1}}
  #finCanvas{position:absolute;inset:0;width:100%;height:100%}
  .neon{position:absolute;top:5vh;left:50%;transform:translateX(-50%);white-space:nowrap;
    padding:.12em .6em .16em;border-radius:22px;font-family:'Tilt Neon','Fredoka',sans-serif;
    font-size:clamp(24px,7vw,88px);letter-spacing:.05em;max-width:calc(100vw - 24px);text-transform:uppercase;
    background:rgba(4,8,24,.82);border:4px solid var(--rim);color:var(--core);
    box-shadow:0 0 4px #fff,0 0 14px var(--n),0 0 36px var(--n),0 0 80px var(--n),inset 0 0 22px var(--n);
    text-shadow:0 0 3px #fff,0 0 10px var(--n),0 0 24px var(--n),0 0 48px var(--n),0 0 90px var(--n)}
  .neon.blue{--n:#1fb8ff;--rim:#bdeeff;--core:#effbff;animation:neonOn 1.8s steps(1) both}
  .neon.red{--n:#ff2d55;--rim:#ffc4d0;--core:#fff1f4;animation:neonOn 1.8s steps(1) both, buzz 3.5s 2.2s infinite steps(1)}
  @keyframes neonOn{0%{opacity:0}12%{opacity:1}16%{opacity:.12}22%{opacity:1}30%{opacity:.25}36%,100%{opacity:1}}
  @keyframes buzz{0%,100%{opacity:1}40%{opacity:.3}42%{opacity:1}45%{opacity:.45}47%{opacity:1}}
  #finale.lose #hand{display:block}
  #hand{display:none;position:absolute;left:50%;top:0;width:min(40vw,210px);transform:translate(-50%,-105%)}
  #hand svg{display:block;width:100%;height:auto;transform-origin:50% 0;filter:drop-shadow(0 12px 22px rgba(0,0,0,.6))}
  #hand.go{animation:handDown 1.9s cubic-bezier(.22,.9,.3,1.05) .3s forwards}
  #hand.go svg{animation:pump .55s 2.3s ease-in-out 4}
  @keyframes handDown{to{transform:translate(-50%,calc(54vh - 64%))}}
  @keyframes pump{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(26px) rotate(-4deg)}}
  #finaleBtn{position:absolute;bottom:5vh;left:50%;transform:translateX(-50%);opacity:0;animation:finBtn .6s 3.2s forwards;font-size:17px;padding:10px 22px}
  @keyframes finBtn{to{opacity:1}}

  /* "CABO!" shout */
  #shout{position:fixed;left:50%;top:42%;z-index:30;pointer-events:none;transform:translate(-50%,-50%) scale(.3);opacity:0;
    font-family:'Tilt Neon','Fredoka',sans-serif;font-size:clamp(44px,12vw,120px);color:#fff1f4;letter-spacing:.06em;white-space:nowrap;
    text-shadow:0 0 6px #fff,0 0 18px var(--cabo),0 0 44px var(--cabo),0 0 90px var(--cabo)}
  #shout.go{animation:shout 1.6s cubic-bezier(.2,1.4,.4,1) forwards}
  #shout small{display:block;font-size:.28em;text-align:center;letter-spacing:.02em;font-family:'Fredoka',sans-serif}
  @keyframes shout{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.08) rotate(3deg)}30%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}

  /* home / lobby */
  .panel{max-width:520px;margin:34px auto;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:18px;text-align:center}
  .panel h2{margin:0 0 6px;font-size:26px}
  .panel p{color:var(--muted);margin:0 0 18px}
  .field{display:flex;flex-direction:column;gap:6px;text-align:left;margin:0 auto 16px;max-width:320px;color:var(--muted);font-size:14px}
  .inp{font-family:inherit;font-size:17px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--text);outline:none}
  .inp:focus{border-color:var(--accent)}
  .codeInp{text-transform:uppercase;letter-spacing:.3em;text-align:center;width:190px;font-weight:600}
  .homeBtns{display:flex;flex-direction:column;gap:10px;max-width:340px;margin:0 auto}
  .btn.big{font-size:17px;padding:11px 18px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .choice:disabled{opacity:.35;cursor:not-allowed}
  .joinRow{display:flex;gap:8px;justify-content:center}
  .divider{color:var(--muted);margin:10px 0 0;font-size:14px}
  .note{min-height:22px;margin-top:14px;color:#ff9aa9;font-size:14px}
  .note.ok{color:var(--muted)}
  .codeBig{font-size:46px;letter-spacing:.22em;font-weight:700;color:var(--accent);margin:2px 0 8px;padding-left:.22em}
  .plist{list-style:none;padding:0;margin:8px auto 18px;max-width:320px;text-align:left}
  .plist li{padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.15)}
  .plist small{color:var(--muted)}
  .roomTag{display:inline-block;margin:-4px 0 8px;font-size:13px;color:var(--accent);background:rgba(255,209,102,.1);padding:2px 8px;border-radius:8px;letter-spacing:.06em}

  /* easter egg: the title flips to reveal a photo */
  .logo{perspective:700px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;outline:none}
  .logoInner{position:relative;display:inline-block;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,1.35,.5,1)}
  .logo.flipped .logoInner{transform:rotateY(180deg)}
  .logoFront,.logoBack{backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .logoFront{display:inline-block}
  header h1 .logoInner,header h1 .logoFront{color:var(--text)}
  .logoBack{position:absolute;left:50%;top:50%;width:min(calc(100% + 8px),130px);height:auto;aspect-ratio:4/3;
    object-fit:contain;border-radius:10px;transform:translate(-50%,-50%) rotateY(180deg);box-shadow:0 2px 10px rgba(0,0,0,.35)}
  .logo:focus-visible .logoInner{outline:2px solid var(--accent);outline-offset:4px;border-radius:8px}

  /* 6-7 easter egg */
  .sixSeven{position:absolute;z-index:24;pointer-events:none;user-select:none}
  .sixSeven.inward{transform:scaleX(-1)}
  @media (prefers-reduced-motion: reduce){ .card.glow{animation:none;box-shadow:0 0 0 3px #9fd3ff} .card.pick:hover{transform:none} }
</style>
</head>

let lang='pt';
try{ const s=localStorage.getItem('cabo-lang'); if(s&&I18N[s]) lang=s; else { const n=(navigator.language||'').toLowerCase(); lang=n.startsWith('de')?'de':n.startsWith('en')?'en':'pt'; } }catch(e){}
const L = () => I18N[lang];

/* ---------- state ---------- */
let G=null, speed=750, nBots=2, lobbyBots=0;
let MODE='solo';            // 'solo' | 'host' | 'client'
let mySeat=0;
let myName='';
try{ myName=localStorage.getItem('cabo-name')||''; }catch(e){}
const net={roomP:null, named:null, code:null, me:null, seen:{}, order:[], reqSeq:0, latest:null,
  queue:[], pumping:false, lastApplied:0, lastQueued:0, pending:false, pendT:null, hostPeer:null, joinTimer:null};
let qTail=Promise.resolve(), qLen=0, currentModal=null;
const UI={multi:false, sel:new Set(), swapOwn:null};
function resetUI(){ UI.multi=false; UI.sel.clear(); UI.swapOwn=null; }

function cleanName(s){ return String(s==null?'':s).replace(/[^\p{L}\p{N} _.'-]/gu,'').replace(/\s+/g,' ').trim().slice(0,16); }
const nm = pi => { if(pi===mySeat && pi>=0) return L().you; const s=G&&G.seats&&G.seats[pi]; return s?(cleanName(s.n)||'?'):'?'; };
function tr(e){
  const f=L()[e.k];
  if(f===undefined) return '';
  if(typeof f!=='function') return f;
  const a=e.a||[];
  return (e.pi!==undefined && e.pi!==null) ? f(nm(e.pi), e.pi===mySeat, ...a) : f(...a);
}
function log(k, pi, ...a){ if(MODE==='client'||!G) return; G.log.unshift({k,pi:(pi===undefined?null:pi),a}); if(G.log.length>30)G.log.pop(); }

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeDeck(){
  const d=[0,0,13,13];
  for(let v=1;v<=12;v++)for(let i=0;i<4;i++)d.push(v);
  return shuffle(d);
}
const cls = v => v===0?'zero':v<=4?'low':v<=6?'mid':v<=8?'peek':v<=10?'spy':v<=12?'swap':'high';
const faceHTML = v => `${v}${isPow(v)?`<span class="pw">${L().pw[powOf(v)]}</span>`:''}`;
const topDiscard = () => G.discard[G.discard.length-1];
const live = p => p.hand.map((c,i)=>c.gone?-1:i).filter(i=>i>=0);
const nLive = p => p.hand.filter(c=>!c.gone).length;
const wait = ms => new Promise(r=>setTimeout(r,ms));
const DUR = () => Math.round(Math.max(260, Math.min(650, speed*0.6)));
const PEEK_MS = () => Math.max(1700, Math.min(3000, speed*2.8));
const slotKey = (pi,i) => `p${pi}-${i}`;
const busy = () => !G || G.anim>0 || (MODE==='client' ? net.pending : qLen>0);
const isBot = pi => G.seats[pi] && G.seats[pi].k==='b';

function newState(){
  return {gid:null, seats:[], players:[], round:0, log:[], hide:new Set(), hideDiscard:0, anim:0,
    discard:[], deck:[], deckN:0, held:null, heldPub:false, phase:'deal', power:null, current:-1, caller:null,
    ipk:[], peekShow:new Map(), tempUp:new Map(), glow:new Set(), revealed:false, initPeeks:[],
    result:null, mid:0, moves:[], note:null, showBtn:false, mem:[], resetUsed:[], turns:0, starter:0};
}

/* ---------- animation engine ---------- */
function rectOf(k){ const e=document.querySelector(`[data-key="${k}"]`); return e?e.getBoundingClientRect():null; }
function fly(from,to,{v,startUp,endUp,dur}){
  if(!from||!to||document.hidden) return Promise.resolve();
  dur = dur||DUR();
  const el=document.createElement('div');
  const setFace = up => { el.className='card fly '+(up?cls(v):'back'); el.innerHTML=up?faceHTML(v):''; };
  setFace(startUp);
  Object.assign(el.style,{left:from.left+'px',top:from.top+'px',width:from.width+'px',height:from.height+'px',
    fontSize:(from.width*0.46)+'px',borderRadius:(from.width*0.15)+'px'});
  $('#fx').appendChild(el);
  const dx=(to.left+to.width/2)-(from.left+from.width/2);
  const dy=(to.top+to.height/2)-(from.top+from.height/2);
  const sx=to.width/from.width, sy=to.height/from.height;
  const flip=startUp!==endUp;
  const dist=Math.hypot(dx,dy);
  const lift=Math.min(70, 16+dist*0.15);
  const ms=(1+sx)/2*1.12, my=(1+sy)/2*1.12;
  const rot=dx===0?0:(dx>0?7:-7);
  const kf=[
    {transform:'translate(0px,0px) rotate(0deg) scale(1,1)'},
    {transform:`translate(${dx/2}px,${dy/2-lift}px) rotate(${rot}deg) scale(${flip?0.03:ms},${my})`, offset:.5},
    {transform:`translate(${dx}px,${dy}px) rotate(0deg) scale(${sx},${sy})`}
  ];
  let anim;
  try{ anim=el.animate(kf,{duration:dur,easing:'ease-in-out',fill:'forwards'}); }
  catch(e){ el.remove(); return Promise.resolve(); }
  if(flip) setTimeout(()=>setFace(endUp), dur/2);
  return Promise.race([anim.finished.catch(()=>{}), wait(dur+400)]).then(()=>el.remove());
}
async function flipKey(key, v, toUp){
  const g=G, r=rectOf(key);
  G.hide.add(key); render();
  await fly(r,r,{v,startUp:!toUp,endUp:toUp});
  if(G!==g) return;
  G.hide.delete(key); render();
}

async function animDeal(){
  const g=G, n=G.players.length;
  const stag=Math.max(30, speed*0.06), d=Math.max(260, DUR()*0.8);
  const deckR=rectOf('deck'), flights=[];
  let k=0;
  for(let i=0;i<4;i++) for(let pi=0;pi<n;pi++){
    const key=slotKey(pi,i), to=rectOf(key);
    flights.push(wait(k++*stag).then(()=>fly(deckR,to,{v:0,startUp:false,endUp:false,dur:d})).then(()=>{ if(G!==g)return; G.hide.delete(key); render(); }));
  }
  await Promise.all(flights);
  if(G!==g) return;
  await fly(rectOf('deck'), rectOf('discard'), {v:G.discard[0],startUp:false,endUp:true});
  if(G!==g) return;
  G.hideDiscard=0; render();
}
async function animPeek(m){
  const g=G, key=slotKey(m.o,m.i);
  if(m.p===mySeat && mySeat>=0){
    G.peekShow.set(key, m.v);
    await flipKey(key, m.v, true);
    if(G!==g) return;
    if(m.ini) return;                       // first peeks stay open until play begins
    await wait(PEEK_MS());
    if(G!==g) return;
    G.peekShow.delete(key);
    await flipKey(key, m.v, false);
  } else {
    G.glow.add(key); render();
    await wait(m.ini?300:Math.max(700, speed*1.1));
    if(G!==g) return;
    G.glow.delete(key); render();
  }
}
async function animHidePeeks(){
  const g=G, list=[...G.peekShow.entries()];
  G.peekShow.clear();
  await Promise.all(list.map(([k,v],j)=>wait(j*90).then(()=>{ if(G===g) return flipKey(k,v,false); })));
}
async function animDraw(p,v){
  const g=G, from=rectOf('deck');
  G.held=v; G.heldPub=false; G.hide.add('held'); render();
  await fly(from, rectOf('held'), {v,startUp:false,endUp:p===mySeat});
  if(G!==g) return;
  G.hide.delete('held'); render();
}
async function animTakeDiscard(){
  const g=G, from=rectOf('discard');
  const v=G.discard.pop(); G.held=v; G.heldPub=true; G.hide.add('held'); render();
  await fly(from, rectOf('held'), {v,startUp:true,endUp:true});
  if(G!==g) return;
  G.hide.delete('held'); render();
}
async function animToss(p){
  const g=G, from=rectOf('held'), v=G.held, vis=G.heldPub||p===mySeat;
  G.discard.push(v); G.held=null; G.hideDiscard++; render();
  await fly(from, rectOf('discard'), {v,startUp:vis,endUp:true});
  if(G!==g) return;
  G.hideDiscard--; render();
}
async function animPlace(m){
  const g=G, P=G.players[m.p], v=G.held, vis=G.heldPub||m.p===mySeat, rHeld=rectOf('held');
  if(m.ok){
    const rs=m.idx.map(i=>rectOf(slotKey(m.p,i)));
    m.idx.forEach(i=>G.hide.add(slotKey(m.p,i)));
    m.old.forEach(o=>G.discard.push(o)); G.hideDiscard+=m.old.length;
    P.hand[m.idx[0]].v = MODE==='client'?null:v;
    G.held=null; render();
    const rDis=rectOf('discard');
    const a=m.old.map((o,k)=>wait(k*110).then(()=>fly(rs[k],rDis,{v:o,startUp:false,endUp:true})).then(()=>{ if(G!==g)return; G.hideDiscard--; if(k>0){ P.hand[m.idx[k]].gone=true; G.hide.delete(slotKey(m.p,m.idx[k])); } render(); }));
    const b=wait(DUR()*0.4).then(()=>fly(rHeld,rs[0],{v,startUp:vis,endUp:false})).then(()=>{ if(G!==g)return; G.hide.delete(slotKey(m.p,m.idx[0])); render(); });
    await Promise.all([...a,b]);
  } else {
    // wrong guess: the marked cards are shown to everyone, then turned back, and the new card joins the hand
    m.idx.forEach((i,k)=>G.tempUp.set(slotKey(m.p,i), m.old[k]));
    await Promise.all(m.idx.map((i,k)=>flipKey(slotKey(m.p,i), m.old[k], true)));
    await wait(Math.max(1200, speed*1.8));
    if(G!==g) return;
    m.idx.forEach(i=>G.tempUp.delete(slotKey(m.p,i)));
    await Promise.all(m.idx.map((i,k)=>flipKey(slotKey(m.p,i), m.old[k], false)));
    if(G!==g) return;
    P.hand.push({v:MODE==='client'?null:v, gone:false});
    const nk=slotKey(m.p,P.hand.length-1);
    G.held=null; G.hide.add(nk); render();
    await fly(rHeld, rectOf(nk), {v,startUp:vis,endUp:false});
    if(G!==g) return;
    G.hide.delete(nk); render();
  }
}
async function animBSwap(m){
  const g=G, ka=slotKey(m.a[0],m.a[1]), kb=slotKey(m.b[0],m.b[1]);
  const ra=rectOf(ka), rb=rectOf(kb);
  G.hide.add(ka); G.hide.add(kb); render();
  const A=G.players[m.a[0]].hand[m.a[1]], B=G.players[m.b[0]].hand[m.b[1]];
  const t=A.v; A.v=B.v; B.v=t;
  await Promise.all([fly(ra,rb,{v:0,startUp:false,endUp:false,dur:DUR()*1.4}), fly(rb,ra,{v:0,startUp:false,endUp:false,dur:DUR()*1.4})]);
  if(G!==g) return;
  G.hide.delete(ka); G.hide.delete(kb); render();
}
async function animReveal(){
  const g=G;
  G.revealed=true;
  const keys=[];
  G.players.forEach((p,pi)=>p.hand.forEach((c,i)=>{ if(!c.gone) keys.push([slotKey(pi,i),c.v]); }));
  keys.forEach(([k])=>G.hide.add(k)); render();
  await Promise.all(keys.map(([k,v],j)=>wait(j*60).then(()=>{ const r=rectOf(k); return fly(r,r,{v,startUp:false,endUp:true}); }).then(()=>{ if(G!==g)return; G.hide.delete(k); render(); })));
}
function shout(seat){
  const s=$('#shout'); s.innerHTML=`CABO!<small></small>`; s.querySelector('small').textContent=L().shoutSub(nm(seat));
  s.classList.remove('go'); void s.offsetWidth; s.classList.add('go');
}

/* ---------- moves: the one path every visible change takes (host and guests) ---------- */
async function applyMove(m){
  const g=G; G.anim++; render();
  try{
    switch(m.t){
      case 'deal': {
        G.round=m.r; G.caller=null; G.held=null; G.heldPub=false; G.result=null; G.showBtn=false; G.discard=[m.d]; G.deckN=m.n;
        G.phase='deal'; G.power=null; G.current=-1; G.revealed=false; G.initPeeks=[];
        G.ipk=G.players.map(()=>[]); G.peekShow.clear(); G.tempUp.clear(); G.glow.clear(); resetUI();
        if(MODE==='client') G.players.forEach(p=>p.hand=Array.from({length:4},()=>({v:null,gone:false})));
        G.hide=new Set(); G.players.forEach((p,pi)=>{ for(let i=0;i<4;i++) G.hide.add(slotKey(pi,i)); }); G.hideDiscard=1;
        closeModal(); stopFinale(); show('game'); render();
        await wait(150); await animDeal(); break;
      }
      case 'peek': {
        if(m.ini){ G.ipk[m.p]=(G.ipk[m.p]||[]).concat(m.i);
          if(m.p===mySeat){ G.initPeeks.push(m.v); if(G.initPeeks.length===2 && G.initPeeks[0]===6 && G.initPeeks[1]===7) setTimeout(showSixSeven, DUR()+50); } }
        if(G.phase==='power') G.phase='wait';
        await animPeek(m); break;
      }
      case 'hidepeeks': await animHidePeeks(); break;
      case 'draw': { G.deckN=m.n; G.phase='holdDeck'; resetUI(); await animDraw(m.p, m.v); break; }
      case 'take': { G.phase='holdDiscard'; resetUI(); await animTakeDiscard(); break; }
      case 'place': { G.phase='wait'; resetUI(); await animPlace(m); break; }
      case 'toss': { resetUI(); if(m.back){ G.phase='choose'; } else { G.phase=m.pw?'power':'wait'; G.power=m.pw||null; } await animToss(m.p); break; }
      case 'bswap': G.phase='wait'; resetUI(); await animBSwap(m); break;
      case 'cabo': G.caller=m.p; shout(m.p); await wait(1300); break;
      case 'turn': G.current=m.c; G.phase=m.ph; G.power=null; G.caller=(m.e===undefined?null:m.e); resetUI(); break;
      case 'reveal': {
        m.g.forEach((arr,pi)=>arr.forEach((v,i)=>{ const c=G.players[pi]&&G.players[pi].hand[i]; if(c && v!==null && !c.gone) c.v=v; }));
        G.peekShow.clear(); G.tempUp.clear();
        await animReveal(); break;
      }
      case 'res': {
        G.players.forEach((p,i)=>p.total=Number(m.tot[i])||0);
        G.result={raw:m.raw,pts:m.pts,e:m.e,kam:m.kam,rst:m.rst||[],over:!!m.over}; G.phase='over';
        render(); showEnd(); break;
      }
      case 'new': G.players.forEach(p=>p.total=0); G.resetUsed=G.players.map(()=>false); G.showBtn=false; closeModal(); stopFinale(); break;
      case 'seat': if(G.seats[m.p]) G.seats[m.p].k='b'; break;
    }
  } finally { if(G===g){ G.anim--; render(); } }
}

/* ---------- host: authoritative engine ---------- */
function enqueue(fn){
  qLen++; render();
  qTail=qTail.then(()=>fn()).catch(e=>console.error(e)).finally(()=>{ qLen--; render(); });
}
async function hEmit(m){
  const g=G;
  m.id=++G.mid; G.moves.push(m); if(G.moves.length>24) G.moves.shift();
  const p=applyMove(m); publish(); await p;
  if(G===g) publish();
}
function snapOf(){
  return {mid:G.mid, r:G.round, ph:G.phase, pw:G.power, c:G.current, e:G.caller, dn:G.deck.length, d:G.discard.slice(-3), h:G.held, hp:G.heldPub?1:0,
    g:G.players.map(p=>p.hand.map(c=>c.gone?'x':(G.revealed?c.v:'?')).join(',')),
    ip:G.ipk.map(a=>a.slice()), tot:G.players.map(p=>p.total), lg:G.log.slice(0,7).map(e=>[e.k,e.pi,...(e.a||[])])};
}
function buildState(){
  const st={gid:G.gid, sp:speed, seats:G.seats.map(s=>({n:s.n,k:s.k,p:s.peer||null})), moves:G.moves.slice(), snap:snapOf()};
  const size=()=>new TextEncoder().encode(JSON.stringify(st)).length;
  while(size()>3500 && st.moves.length>1) st.moves.shift();
  while(size()>3500 && st.snap.lg.length) st.snap.lg.pop();
  return st;
}
function hostPresence(){
  if(MODE!=='host'||!net.named) return;
  const p={role:'host', code:net.code, n:myName, lobby:G?[]:lobbyPlayers().map(x=>cleanName(x.presence.n)), st:G?buildState():null};
  net.named.presence(p).catch(()=>{});
}
function publish(){ if(MODE==='host') hostPresence(); }

function newHostGame(seats){
  G=newState(); G.gid=Math.random().toString(36).slice(2,9); G.seats=seats;
  G.players=seats.map(()=>({total:0,hand:Array.from({length:4},()=>({v:0,gone:true}))}));
  G.resetUsed=seats.map(()=>false);
  show('game'); render();
  enqueue(startRound);
}

/* memory: what each seat knows about every card on the table (used by the bots, and by a bot that takes over a seat) */
const memInit = () => { G.mem=G.players.map(()=>G.players.map(()=>({}))); };
const learn = (b,o,i,v) => { G.mem[b][o][i]=v; };
const learnAll = (o,i,v) => G.mem.forEach(m=>{ m[o][i]=v; });
const forgetAll = (o,i) => G.mem.forEach(m=>{ delete m[o][i]; });
function memSwap(a,b){ G.mem.forEach(m=>{ const x=m[a[0]][a[1]], y=m[b[0]][b[1]]; delete m[a[0]][a[1]]; delete m[b[0]][b[1]]; if(y!==undefined) m[a[0]][a[1]]=y; if(x!==undefined) m[b[0]][b[1]]=x; }); }

async function startRound(){
  G.round++; G.deck=makeDeck(); G.turns=0;
  G.players.forEach(p=>p.hand=Array.from({length:4},()=>({v:G.deck.pop(),gone:false})));
  const d=G.deck.pop(); G.discard=[d];
  memInit();
  log('roundHdr', null, G.round);
  await hEmit({t:'deal', r:G.round, d, n:G.deck.length});
  await hEmit({t:'turn', c:-1, ph:'initialPeek', e:null});
  await Promise.all(G.seats.map((s,pi)=>s.k==='b'?botInitialPeeks(pi):null));
  await checkAllPeeked();
}
async function botInitialPeeks(pi){
  const p=G.players[pi];
  for(const i of shuffle(live(p).filter(i=>!G.ipk[pi].includes(i))).slice(0,Math.max(0,2-G.ipk[pi].length))){ await wait(120+Math.random()*250); learn(pi,pi,i,p.hand[i].v); await hEmit({t:'peek',p:pi,o:pi,i,v:p.hand[i].v,ini:1}); }
}
async function checkAllPeeked(){
  if(G.phase!=='initialPeek') return;
  if(G.players.every((p,pi)=>G.ipk[pi].length>=2)){ await wait(Math.max(2200, speed*3)); if(G.phase!=='initialPeek') return; await beginPlay(); }
}
async function beginPlay(){
  await hEmit({t:'hidepeeks'});
  const s=(G.round-1)%G.players.length;
  log('starts', s);
  await beginTurn(s);
}
async function beginTurn(c){
  G.turns++;
  await hEmit({t:'turn', c, ph:'choose', e:G.caller});
  if(isBot(c)){ await wait(speed*0.6); await botTurn(c); }
}
async function endTurn(){
  const seat=G.current;
  if(G.deck.length===0){ log('deckOut'); await wait(350); await endRound(); return; }
  const next=(seat+1)%G.players.length;
  if(G.caller!==null && next===G.caller){ await wait(350); await endRound(); return; }
  await beginTurn(next);
}
async function endRound(){
  await hEmit({t:'turn', c:-1, ph:'over', e:G.caller});
  await hEmit({t:'reveal', g:G.players.map(p=>p.hand.map(c=>c.gone?null:c.v))});
  await wait(500);
  const raw=G.players.map(p=>p.hand.reduce((s,c)=>s+(c.gone?0:c.v),0));
  const e=G.caller, pts=raw.slice();
  const kam=G.players.findIndex(p=>{ const v=p.hand.filter(c=>!c.gone).map(c=>c.v).sort((a,b)=>a-b); return v.length===4 && v.join()==='12,12,13,13'; });
  if(kam>=0){ pts.fill(50); pts[kam]=0; log('kamiLog', kam); }
  else if(e!==null){ const others=raw.filter((r,i)=>i!==e); pts[e] = raw[e] <= Math.min(...others) ? 0 : raw[e]+10; }
  const tot=G.players.map((p,i)=>p.total+pts[i]);
  const rst=[];
  tot.forEach((t,i)=>{ if(t===LIMIT && !G.resetUsed[i]){ tot[i]=50; G.resetUsed[i]=true; rst.push(i); } });
  G.lastPts=pts;
  await hEmit({t:'res', raw, pts, e, kam, rst, tot, over:tot.some(t=>t>LIMIT)});
}
function hostNextRound(){ closeModal(); G.showBtn=false; render(); enqueue(startRound); }
function hostPlayAgain(){ closeModal(); stopFinale(); G.showBtn=false; G.round=0; enqueue(async()=>{ await hEmit({t:'new'}); await startRound(); }); }

/* shared steps used by humans and bots */
async function doPlace(seat, idx){
  const p=G.players[seat], v=G.held, pub=G.heldPub;
  const old=idx.map(i=>p.hand[i].v);
  const ok = idx.length===1 || old.every(x=>x===old[0]);
  if(idx.length===1) log(pub?'tookSwap':'drewSwap', seat, ...(pub?[v,old[0]]:[old[0]]));
  else if(ok) log('multiOk', seat, idx.length, old[0]);
  else log('multiFail', seat, idx.length);
  await hEmit({t:'place', p:seat, idx, old, ok:ok?1:0});
  if(ok){
    idx.forEach(i=>forgetAll(seat,i));
    if(pub) learnAll(seat,idx[0],v); else learn(seat,seat,idx[0],v);
  } else {
    idx.forEach((i,k)=>learnAll(seat,i,old[k]));
    const ni=p.hand.length-1;
    if(pub) learnAll(seat,ni,v); else learn(seat,seat,ni,v);
  }
  await endTurn();
}
async function doToss(seat){
  const v=G.held, pw=powOf(v);
  log('discarded', seat, v);
  await hEmit({t:'toss', p:seat, pw});
  if(!pw) await endTurn();
  return pw;
}
async function doPeek(seat, o, i){
  const v=G.players[o].hand[i].v;
  learn(seat,o,i,v);
  log(o===seat?'usedPeek':'usedSpy', seat, ...(o===seat?[]:[o]));
  await hEmit({t:'peek', p:seat, o, i, v});
  await endTurn();
}
async function doBSwap(seat, i, o, j){
  log('usedSwap', seat, o);
  memSwap([seat,i],[o,j]);
  await hEmit({t:'bswap', p:seat, a:[seat,i], b:[o,j]});
  await endTurn();
}
const validOwn = (seat,i) => typeof i==='number' && G.players[seat].hand[i] && !G.players[seat].hand[i].gone;
const validOpp = (seat,o,j,forSwap) => typeof o==='number' && o!==seat && G.players[o] && G.players[o].hand[j] && !G.players[o].hand[j].gone && !(forSwap && o===G.caller);

// a human action, from the host's own clicks or from a guest's request
async function act(seat,a,i,o,sel){
  if(!G || !G.seats[seat] || G.seats[seat].k==='b') return;
  if(G.phase==='initialPeek'){
    if(a!=='slot' || !validOwn(seat,i) || G.ipk[seat].includes(i) || G.ipk[seat].length>=2) return;
    const v=G.players[seat].hand[i].v; learn(seat,seat,i,v);
    await hEmit({t:'peek',p:seat,o:seat,i,v,ini:1});
    await checkAllPeeked(); return;
  }
  if(seat!==G.current) return;
  if(G.phase==='choose'){
    if(a==='deck'){ const v=G.deck.pop(); await hEmit({t:'draw',p:seat,v,n:G.deck.length}); }
    else if(a==='discard' && G.discard.length) await hEmit({t:'take',p:seat});
    else if(a==='cabo' && G.caller===null){ log('calledCabo', seat); await hEmit({t:'cabo',p:seat}); await endTurn(); }
  } else if(G.phase==='holdDeck'||G.phase==='holdDiscard'){
    if(a==='slot' && validOwn(seat,i)) await doPlace(seat,[i]);
    else if(a==='multi' && Array.isArray(sel)){
      const s=[...new Set(sel.filter(x=>typeof x==='number'))].filter(x=>validOwn(seat,x)).slice(0,8);
      if(s.length>=2) await doPlace(seat,s);
    }
    else if(a==='discard'){
      if(G.phase==='holdDiscard') await hEmit({t:'toss',p:seat,back:1});
      else await doToss(seat);
    }
  } else if(G.phase==='power'){
    if(a==='skip') await endTurn();
    else if(G.power==='peek' && a==='slot' && (o===undefined||o===null||o===seat) && validOwn(seat,i)) await doPeek(seat,seat,i);
    else if(G.power==='spy' && a==='slot' && validOpp(seat,o,i,false)) await doPeek(seat,o,i);
    else if(G.power==='swap' && a==='bswap' && validOwn(seat,i) && validOpp(seat,o,sel,true)) await doBSwap(seat,i,o,sel);
  }
}

/* ---------- bots (run by the host) ---------- */
const AVG=6.5;
function knownOwn(b){ const m=G.mem[b][b]; return live(G.players[b]).map(i=>({i, v:m[i]})); }
function estHand(b,o){ const m=G.mem[b][o]; return live(G.players[o]).reduce((s,i)=>s+(m[i]!==undefined?m[i]:AVG),0); }
function bestSwap(b, v){
  let best={idx:[], gain:-Infinity};
  const own=knownOwn(b);
  own.forEach(({i,v:k})=>{ const g=(k!==undefined?k:AVG+0.3)-v; if(g>best.gain) best={idx:[i],gain:g}; });
  const groups={};
  own.forEach(({i,v:k})=>{ if(k!==undefined) (groups[k]=groups[k]||[]).push(i); });
  Object.entries(groups).forEach(([k,ids])=>{ if(ids.length>=2){ const g=ids.length*Number(k)-v+1.5; if(g>best.gain) best={idx:ids,gain:g}; } });
  return best;
}
function swapTarget(b){
  const own=knownOwn(b).filter(x=>x.v!==undefined).sort((a,b2)=>b2.v-a.v)[0];
  if(!own || own.v<8) return null;
  let tgt=null;
  G.players.forEach((p,o)=>{ if(o===b||o===G.caller) return; live(p).forEach(j=>{ const k=G.mem[b][o][j]; const val=k!==undefined?k:AVG; if(!tgt||val<tgt.val) tgt={o,j,val}; }); });
  if(!tgt || own.v-tgt.val<2) return null;
  return {i:own.i, o:tgt.o, j:tgt.j, gain:own.v-tgt.val};
}
function powerValue(b,v){
  const k=powOf(v);
  if(k==='peek') return knownOwn(b).some(x=>x.v===undefined)?2.5:0;
  if(k==='spy') return 1;
  if(k==='swap'){ const t=swapTarget(b); return t?t.gain:0; }
  return 0;
}
function wantsCabo(b){
  if(G.caller!==null || G.turns<=G.players.length) return false;
  const own=knownOwn(b), unk=own.filter(x=>x.v===undefined).length, e=estHand(b,b);
  const oppMin=Math.min(...G.players.map((p,o)=>o===b?Infinity:estHand(b,o)));
  if(unk===0 && e<=7) return true;
  if(unk===0 && e<=12 && e<oppMin-3) return true;
  if(unk===1 && e<=8.5 && e<oppMin-4) return true;
  return G.deck.length<6 && unk===0 && e<oppMin;
}
async function botTurn(seat){
  if(wantsCabo(seat)){ log('calledCabo', seat); await hEmit({t:'cabo',p:seat}); await endTurn(); return; }
  const top=topDiscard();
  const fromTop = top!==undefined ? bestSwap(seat, top) : {gain:-Infinity};
  if(fromTop.gain>=3 || (top<=2 && fromTop.gain>=1.5)){
    await hEmit({t:'take',p:seat});
    await wait(speed*0.5);
    await doPlace(seat, fromTop.idx);
    return;
  }
  const v=G.deck.pop();
  await hEmit({t:'draw',p:seat,v,n:G.deck.length});
  await wait(speed*0.5);
  await botFinishHold(seat);
}
async function botFinishHold(seat){
  const v=G.held;
  if(G.heldPub){ const b=bestSwap(seat,v); await doPlace(seat, b.idx.length?b.idx:[live(G.players[seat])[0]]); return; }
  const b=bestSwap(seat,v), pv=powerValue(seat,v);
  if(b.idx.length && b.gain>=Math.max(1,pv)){ await doPlace(seat,b.idx); return; }
  const pw=await doToss(seat);
  if(pw){ await wait(speed*0.5); await botPower(seat); }
}
async function botPower(seat){
  const k=G.power;
  if(k==='peek'){
    const u=knownOwn(seat).filter(x=>x.v===undefined);
    if(u.length) return doPeek(seat, seat, u[Math.floor(Math.random()*u.length)].i);
  } else if(k==='spy'){
    const opts=[];
    G.players.forEach((p,o)=>{ if(o!==seat) live(p).forEach(j=>{ if(G.mem[seat][o][j]===undefined) opts.push([o,j]); }); });
    if(opts.length){ const [o,j]=opts[Math.floor(Math.random()*opts.length)]; return doPeek(seat,o,j); }
  } else if(k==='swap'){
    const t=swapTarget(seat);
    if(t) return doBSwap(seat,t.i,t.o,t.j);
  }
  await endTurn();
}
// a guest left: a bot takes the seat and carries on from wherever the turn stood
async function seatToBot(seat){
  if(!G || !G.seats[seat] || G.seats[seat].k!=='p') return;
  log('seatBot', seat);
  await hEmit({t:'seat',p:seat});
  if(G.phase==='initialPeek'){ await botInitialPeeks(seat); await checkAllPeeked(); return; }
  if(G.current!==seat) return;
  if(G.phase==='choose') await botTurn(seat);
  else if(G.phase==='holdDeck'||G.phase==='holdDiscard') await botFinishHold(seat);
  else if(G.phase==='power') await botPower(seat);
}

/* ---------- networking ----------
   Inside Claude the page uses Claude's live rooms; anywhere else (GitHub Pages, Cloudflare Pages)
   it connects browsers directly with PeerJS / WebRTC, the same way LuMa does. Both expose
   host(code) / connect(code) -> {presence, peers, onPeers, leave}. */
const PEER_PREFIX='cabochechuda-';
function makePeerNet(){
  if(typeof window.Peer!=='function') return null;
  const OPTS={debug:0, config:{iceServers:[
    {urls:'stun:stun.l.google.com:19302'},
    {urls:'stun:stun1.l.google.com:19302'},
    {urls:'stun:stun.cloudflare.com:3478'}
  ]}};
  const HB=3000, TIMEOUT=15000;
  function hub(){
    const st={me:null, mine:{}, others:new Map(), subs:new Set(), pend:{joined:[],left:[],updated:[]}, t:null, snap:[], dirty:true};
    st.list=()=>{
      if(!st.dirty) return st.snap;
      const a=[{peer:st.me,isMe:true,sameTab:true,kind:'viewer',presence:st.mine}];
      st.others.forEach((v,k)=>a.push({peer:k,isMe:false,sameTab:false,kind:'viewer',presence:v}));
      st.snap=a; st.dirty=false; return a;
    };
    st.notify=(kind,id)=>{
      st.dirty=true; st.pend[kind].push(id);
      if(st.t) return;
      st.t=setTimeout(()=>{
        st.t=null; const all=st.list(); const pick=ids=>all.filter(p=>ids.includes(p.peer));
        const ch={peers:all, joined:pick(st.pend.joined), left:st.pend.left.map(id=>({peer:id,isMe:false,sameTab:false,presence:{}})), updated:pick(st.pend.updated)};
        st.pend={joined:[],left:[],updated:[]};
        st.subs.forEach(f=>{ try{ f(ch); }catch(e){ console.error(e); } });
      },16);
    };
    st.merge=p=>{ const m={...st.mine,...p}; Object.keys(p).forEach(k=>{ if(p[k]===null) delete m[k]; }); st.mine=m; st.dirty=true; };
    st.onPeers=fn=>{ st.subs.add(fn); setTimeout(()=>{ const a=st.list(); fn({peers:a,joined:a,left:[],updated:[]}); },0); return ()=>st.subs.delete(fn); };
    return st;
  }
  const isObj=x=>x && typeof x==='object' && !Array.isArray(x);

  return {
    // create a room: resolves once this browser is reachable under the room's name
    host(code){
      return new Promise((resolve,reject)=>{
        const st=hub(), conns=new Map(); let sendT=null, dead=false, ready=false, hb=null;
        const peer=new window.Peer(PEER_PREFIX+code.toLowerCase(), OPTS);
        const flush=()=>{ sendT=null; const msg={type:'p',presence:st.mine}; conns.forEach(c=>{ if(c.open) try{ c.send(msg); }catch(e){} }); };
        const drop=id=>{ const c=conns.get(id); if(!c) return; conns.delete(id); try{ c.close(); }catch(e){} if(st.others.delete(id)) st.notify('left',id); };
        peer.on('open',id=>{
          ready=true; st.me=id; st.dirty=true;
          hb=setInterval(()=>{ const now=Date.now(); conns.forEach((c,cid)=>{ if(now-c._last>TIMEOUT) drop(cid); else if(c.open) try{ c.send({type:'hb'}); }catch(e){} }); },HB);
          resolve({
            presence(p){ st.merge(p); if(!sendT) sendT=setTimeout(flush,30); return Promise.resolve(); },
            peers:()=>st.list(),
            onPeers:fn=>st.onPeers(fn),
            leave(){ dead=true; clearInterval(hb); conns.forEach(c=>{ try{ c.close(); }catch(e){} }); try{ peer.destroy(); }catch(e){} return Promise.resolve(); }
          });
        });
        peer.on('connection',c=>{
          if(conns.size>=10){ c.on('open',()=>{ try{ c.close(); }catch(e){} }); return; }
          c._last=Date.now();
          c.on('open',()=>{ conns.set(c.peer,c); c._last=Date.now(); try{ c.send({type:'p',presence:st.mine}); }catch(e){} });
          c.on('data',d=>{
            c._last=Date.now();
            if(isObj(d) && d.type==='p' && isObj(d.presence)){
              const ex=st.others.has(c.peer); st.others.set(c.peer,d.presence); st.notify(ex?'updated':'joined',c.peer);
            }
          });
          c.on('close',()=>drop(c.peer)); c.on('error',()=>drop(c.peer));
        });
        peer.on('error',e=>{ if(!ready){ try{ peer.destroy(); }catch(_){} reject(e); } });
        peer.on('disconnected',()=>{ if(!dead) try{ peer.reconnect(); }catch(e){} });
      });
    },
    // join a room: resolves once the direct link to the host is open
    connect(code){
      return new Promise((resolve,reject)=>{
        const st=hub(), hostId=PEER_PREFIX+code.toLowerCase();
        let conn=null, done=false, sendT=null, dead=false, hb=null;
        const peer=new window.Peer(OPTS);
        const fail=e=>{ if(done) return; done=true; clearTimeout(timer); try{ peer.destroy(); }catch(_){} reject(e); };
        const timer=setTimeout(()=>fail({type:'timeout'}),TIMEOUT);
        const hostGone=()=>{ if(dead) return; clearInterval(hb); if(st.others.delete(hostId)) st.notify('left',hostId); };
        const api={
          presence(p){ st.merge(p); if(!sendT) sendT=setTimeout(()=>{ sendT=null; if(conn&&conn.open) try{ conn.send({type:'p',presence:st.mine}); }catch(e){} },30); return Promise.resolve(); },
          peers:()=>st.list(),
          onPeers:fn=>st.onPeers(fn),
          leave(){ dead=true; clearInterval(hb); try{ conn&&conn.close(); }catch(e){} try{ peer.destroy(); }catch(e){} return Promise.resolve(); }
        };
        peer.on('error',e=>{ if(!done) fail(e); });
        peer.on('open',id=>{
          st.me=id; st.dirty=true;
          conn=peer.connect(hostId,{reliable:true, serialization:'json'});
          conn.on('open',()=>{
            if(done) return; done=true; clearTimeout(timer);
            conn._last=Date.now();
            try{ conn.send({type:'p',presence:st.mine}); }catch(e){}
            hb=setInterval(()=>{ if(Date.now()-conn._last>TIMEOUT){ try{ conn.close(); }catch(e){} hostGone(); } else if(conn.open) try{ conn.send({type:'hb'}); }catch(e){} },HB);
            resolve(api);
          });
          conn.on('data',d=>{
            conn._last=Date.now();
            if(isObj(d) && d.type==='p' && isObj(d.presence)){
              const ex=st.others.has(hostId); st.others.set(hostId,d.presence); st.notify(ex?'updated':'joined',hostId);
            }
          });
          conn.on('close',hostGone); conn.on('error',hostGone);
        });
        peer.on('disconnected',()=>{ if(!dead && done) try{ peer.reconnect(); }catch(e){} });
      });
    }
  };
}
function claudeRooms(room){
  if(!room) return null;
  const j=code=>room.join('cabo-'+code.toLowerCase());
  return {host:j, connect:j};
}
function initRoom(){
  try{
    const inClaude = window.claude && typeof window.claude.use==='function';
    net.roomP = inClaude ? Promise.resolve(window.claude.use('room')).then(claudeRooms).catch(()=>null) : Promise.resolve(makePeerNet());
  }catch(e){ net.roomP=Promise.resolve(null); }
  net.roomP.then(r=>{ if(!r){ $('#hostBtn').disabled=true; $('#joinBtn').disabled=true; homeNote('onlineUnavailable'); } });
}
function homeNote(k, ok){ const n=$('#homeNote'); n.dataset.k=k||''; n.className='note'+(ok?' ok':''); n.textContent=k?L()[k]:''; }
function readName(){ myName=cleanName($('#nameIn').value)||L().you; try{ localStorage.setItem('cabo-name',myName); }catch(e){} }
function lobbyPlayers(){
  if(!net.named) return [];
  const ps=net.named.peers().filter(p=>!p.sameTab && p.kind==='viewer' && p.presence && p.presence.role==='player');
  return ps.sort((a,b)=>net.order.indexOf(a.peer)-net.order.indexOf(b.peer));
}
function leaveRoom(){
  if(net.named){ try{ net.named.leave().catch(()=>{}); }catch(e){} }
  net.named=null; net.code=null; net.hostPeer=null; net.latest=null; net.queue=[]; net.pending=false;
  clearTimeout(net.joinTimer); MODE='solo';
}
async function createRoom(){
  readName(); homeNote('connecting', true);
  const room=await net.roomP; if(!room){ homeNote('onlineUnavailable'); return; }
  let named=null, code='';
  for(let tries=0; tries<4 && !named; tries++){
    code=Array.from({length:6},()=>String.fromCharCode(65+Math.floor(Math.random()*26))).join('');
    try{ named=await room.host(code); }
    catch(e){ if(!(e && e.type==='unavailable-id')){ homeNote('onlineUnavailable'); return; } }
  }
  if(!named){ homeNote('onlineUnavailable'); return; }
  leaveRoom();
  net.named=named; net.code=code; net.order=[]; net.seen={}; MODE='host'; G=null; mySeat=0;
  named.onPeers(onHostPeers, ()=>{});
  hostPresence(); homeNote(null);
  show('lobby'); renderLobby();
}
function onHostPeers(ch){
  ch.joined.forEach(p=>{ if(!p.sameTab && !net.order.includes(p.peer)) net.order.push(p.peer); });
  ch.left.forEach(p=>{
    if(G){ const seat=G.seats.findIndex(s=>s.k==='p' && s.peer===p.peer); if(seat>=0) enqueue(()=>seatToBot(seat)); }
  });
  if(G){
    ch.peers.forEach(p=>{
      if(p.sameTab || !p.presence || p.presence.role!=='player') return;
      const r=p.presence.req; if(!r || typeof r.s!=='number') return;
      if(r.s <= (net.seen[p.peer]||0)) return;
      net.seen[p.peer]=r.s;
      const seat=G.seats.findIndex(s=>s.k==='p' && s.peer===p.peer);
      if(seat<0) return;
      const a=String(r.a), num=x=>(typeof x==='number'&&Number.isInteger(x))?x:null;
      if(!['deck','discard','slot','cabo','multi','skip','bswap'].includes(a)) return;
      const sel = a==='multi' ? (Array.isArray(r.sel)?r.sel.map(num).filter(x=>x!==null):[]) : num(r.sel);
      enqueue(()=>act(seat,a,num(r.i),num(r.o),sel));
    });
    if(ch.joined.length) publish();
  } else { hostPresence(); renderLobby(); }
}
function startOnline(){
  const players=lobbyPlayers();
  const humans=Math.min(players.length,3);
  const bots=Math.min(lobbyBots, 3-humans);
  if(1+humans+bots<2){ $('#lobbyNote').textContent=L().needPlayers; return; }
  const seats=[{n:myName,k:'h'}];
  players.slice(0,humans).forEach(p=>seats.push({n:cleanName(p.presence.n)||'?',k:'p',peer:p.peer}));
  for(let j=0;j<bots;j++) seats.push({n:NAMES[j],k:'b'});
  players.forEach(p=>{ net.seen[p.peer]=(p.presence.req&&typeof p.presence.req.s==='number')?p.presence.req.s:0; });
  mySeat=0;
  newHostGame(seats);
}
async function joinRoom(){
  readName();
  const code=$('#codeIn').value.toUpperCase().replace(/[^A-Z]/g,'');
  if(!/^[A-Z]{6}$/.test(code)){ homeNote('badCode'); return; }
  homeNote('connecting', true);
  const room=await net.roomP; if(!room){ homeNote('onlineUnavailable'); return; }
  let named;
  try{ named=await room.connect(code); }
  catch(e){ homeNote((e && (e.type==='peer-unavailable'||e.type==='timeout'))?'roomNotFound':'onlineUnavailable'); return; }
  leaveRoom();
  net.named=named; net.code=code; MODE='client'; G=null; mySeat=-1; net.reqSeq=0; net.lastApplied=0; net.lastQueued=0;
  named.presence({role:'player', n:myName}).catch(()=>{});
  named.onPeers(onClientPeers, ()=>{});
  homeNote(null); show('lobby'); renderLobby();
  net.joinTimer=setTimeout(()=>{ if(MODE==='client' && !net.hostPeer){ leaveRoom(); show('home'); homeNote('roomNotFound'); } }, 15000);
}
function findHost(){
  if(!net.named) return null;
  return net.named.peers().find(p=>!p.sameTab && p.presence && p.presence.role==='host' && p.presence.code===net.code) || null;
}
function onClientPeers(){
  const me=net.named && net.named.peers().find(p=>p.isMe && p.sameTab); if(me) net.me=me.peer;
  const h=findHost();
  if(!h){
    if(net.hostPeer){ leaveRoom(); G=null; stopFinale(); closeModal(); $('#fx').innerHTML=''; show('home'); homeNote('hostLeft'); }
    return;
  }
  net.hostPeer=h.peer; clearTimeout(net.joinTimer);
  const st=h.presence.st;
  if(st && st.snap && Array.isArray(st.seats)) handleState(st);
  else renderLobby();
}
function handleState(st){
  net.latest=st;
  speed=Number(st.sp)||speed;
  if(!G || G.gid!==st.gid){ initMirror(st); return; }
  syncSeats(st);
  const fresh=(Array.isArray(st.moves)?st.moves:[]).filter(m=>m && typeof m.id==='number' && m.id>net.lastQueued).sort((a,b)=>a.id-b.id);
  if(fresh.length && fresh[0].id>net.lastQueued+1){
    net.queue=[]; net.lastQueued=net.lastApplied=st.snap.mid;
    if(!net.pumping) applySnap(st.snap);
    return;
  }
  fresh.forEach(m=>{ net.queue.push(m); net.lastQueued=m.id; });
  pump();
}
function syncSeats(st){
  G.seats=st.seats.map(s=>({n:cleanName(s.n),k:['h','p','b'].includes(s.k)?s.k:'b',peer:s.p||null}));
  mySeat=G.seats.findIndex(s=>s.peer && s.peer===net.me);
}
function initMirror(st){
  G=newState(); G.gid=st.gid; syncSeats(st);
  G.players=G.seats.map(()=>({total:0,hand:[]}));
  net.queue=[]; net.lastApplied=net.lastQueued=st.snap.mid; net.pending=false;
  closeModal(); stopFinale(); show('game'); applySnap(st.snap);
}
async function pump(){
  if(net.pumping) return; net.pumping=true;
  try{
    while(net.queue.length && G){
      const m=net.queue.shift();
      try{ await applyMove(m); }catch(e){ console.error(e); }
      net.lastApplied=Math.max(net.lastApplied,m.id); net.pending=false; clearTimeout(net.pendT);
    }
  } finally { net.pumping=false; }
  const st=net.latest;
  if(G && st && st.gid===G.gid && st.snap.mid===net.lastApplied) applySnap(st.snap);
}
function applySnap(s){
  const num=x=>{ const n=Number(x); return Number.isFinite(n)?n:0; };
  const prevPh=G.phase, prevC=G.current;
  G.round=num(s.r); G.phase=String(s.ph); G.current=num(s.c); G.caller=(s.e===null||s.e===undefined)?null:num(s.e);
  G.power=['peek','spy','swap'].includes(s.pw)?s.pw:null;
  G.deckN=num(s.dn); G.discard=(Array.isArray(s.d)?s.d:[]).map(num); G.held=(s.h===null||s.h===undefined)?null:num(s.h); G.heldPub=!!s.hp;
  let anyUp=false;
  (s.g||[]).forEach((str,pi)=>{
    if(!G.players[pi]) G.players[pi]={total:0,hand:[]};
    G.players[pi].hand=String(str).split(',').slice(0,16).map(x=>x==='x'?{v:null,gone:true}:x==='?'?{v:null,gone:false}:(anyUp=true,{v:num(x),gone:false}));
  });
  G.revealed=anyUp;
  G.ipk=(Array.isArray(s.ip)?s.ip:[]).map(a=>Array.isArray(a)?a.map(num):[]);
  (s.tot||[]).forEach((t,pi)=>{ if(G.players[pi]) G.players[pi].total=num(t); });
  G.log=(Array.isArray(s.lg)?s.lg:[]).map(a=>({k:String(a[0]),pi:(a[1]===null||a[1]===undefined)?null:num(a[1]),a:a.slice(2).map(x=>typeof x==='boolean'?x:num(x))}));
  G.hide.clear(); G.hideDiscard=0; G.glow.clear(); G.tempUp.clear();
  if(G.phase!=='initialPeek') G.peekShow.clear();
  if(prevPh!==G.phase || prevC!==G.current) resetUI();
  render();
}
function sendReq(a,i,o,sel){
  if(!net.named) return;
  net.reqSeq++; net.pending=true; render();
  net.named.presence({role:'player', n:myName, req:{s:net.reqSeq, a, i:(i===undefined?null:i), o:(o===undefined?null:o), sel:(sel===undefined?null:sel)}}).catch(()=>{});
  clearTimeout(net.pendT); net.pendT=setTimeout(()=>{ net.pending=false; render(); }, 4000);
}

/* ---------- local input ---------- */
function localAct(a,i,o,sel){
  if(!G || busy() || mySeat<0) return;
  if(MODE==='client') sendReq(a,i,o,sel);
  else enqueue(()=>act(mySeat,a,i,o,sel));
}
function clickSlot(pi,i){
  if(!G || busy() || mySeat<0) return;
  const myTurn=G.current===mySeat, ph=G.phase;
  if(pi===mySeat){
    if(ph==='initialPeek') return localAct('slot',i,mySeat);
    if(!myTurn) return;
    if((ph==='holdDeck'||ph==='holdDiscard')){
      if(UI.multi){ UI.sel.has(i)?UI.sel.delete(i):UI.sel.add(i); render(); return; }
      return localAct('slot',i,mySeat);
    }
    if(ph==='power' && G.power==='peek') return localAct('slot',i,mySeat);
    if(ph==='power' && G.power==='swap'){ UI.swapOwn = UI.swapOwn===i?null:i; render(); return; }
  } else if(myTurn && ph==='power'){
    if(G.power==='spy') return localAct('slot',i,pi);
    if(G.power==='swap' && UI.swapOwn!==null && pi!==G.caller) return localAct('bswap',UI.swapOwn,pi,i);
  }
}

/* ---------- end of round / game ---------- */
function winners(){
  const min=Math.min(...G.players.map(p=>p.total));
  let w=G.players.map((p,i)=>p.total===min?i:-1).filter(i=>i>=0);
  if(w.length>1 && G.result && G.result.pts){ const best=Math.min(...w.map(i=>G.result.pts[i])); w=w.filter(i=>G.result.pts[i]===best); }
  return w;
}
function showEnd(){
  const r=G.result;
  if(r.over && mySeat>=0) showFinale(winners().includes(mySeat), showResult);
  else showResult();
}
function showResult(){
  if(!G||!G.result) return;
  const T=L(), {raw,pts,e,kam,rst,over}=G.result;
  const rows=G.players.map((p,i)=>{
    let tags='';
    if(i===kam) tags+=` <span class="tag ok">${T.kamikaze}</span>`;
    else if(i===e && kam<0) tags+= pts[i]===0?` <span class="tag ok">${T.callerOk}</span>`:` <span class="tag">${T.callerBad}</span>`;
    if((rst||[]).includes(i)) tags+=` <span class="tag info">${T.reset}</span>`;
    return `<tr><td>${esc(nm(i))}${tags}</td><td class="num">${Number(raw[i])}</td><td class="num">${pts[i]>0?'+':''}${Number(pts[i])}</td><td class="num"><b>${p.total}</b></td></tr>`;
  }).join('');
  let html=`<h2>${over?T.gameOver:T.roundOver(G.round)}</h2>
    <table><tr><th>${T.player}</th><th class="num">${T.cards}</th><th class="num">${T.roundCol}</th><th class="num">${T.total}</th></tr>${rows}</table>`;
  if(over){
    const win=winners(), youWin=win.includes(mySeat);

  }
  const hostBtn = MODE==='client' ? `<span style="color:var(--muted);align-self:center">${T.waitHostNext}</span>`

}

/* ---------- render ---------- */
function msgFor(){
  const T=L(), ph=G.phase, me=mySeat>=0 && G.current===mySeat, n=nm(G.current);
  switch(ph){
    case 'deal': return T.dealing;
    case 'initialPeek': { if(mySeat<0) return T.spectating; const k=(G.ipk[mySeat]||[]).length; return k===0?T.peek2:k===1?T.peek1:T.waitOthers; }
    case 'choose': return me?(G.caller!==null?T.lastTurn:T.yourTurn):T.botTurn(n);
    case 'holdDeck': return me?(UI.multi?T.multiHint:T.drew(G.held)):T.botDraws(n);
    case 'holdDiscard': return me?(UI.multi?T.multiHint:T.took(G.held)):T.botTakes(n,false,G.held);
    case 'power': return me?(G.power==='peek'?T.pwPeek:G.power==='spy'?T.pwSpy:(UI.swapOwn===null?T.pwSwap1:T.pwSwap2)):T.botPower(n,false,G.power);
    case 'wait': return (G.current>=0 && !me)?T.botTurn(n):'';
    case 'over': return G.result?'':T.revealing;
  }
  return '';
}
function mkBtn(cls_, text, fn, dis){ const b=document.createElement('button'); b.className='btn '+cls_; b.textContent=text; b.onclick=fn; if(dis) b.disabled=true; return b; }
function renderMsg(){
  const m=$('#msg'), A=$('#acts'); m.innerHTML=''; A.innerHTML='';

    return;
  }
  m.textContent=msgFor();
  const me=mySeat>=0 && G.current===mySeat, idle=!busy();
  if(!me) return;
  if(G.phase==='choose' && G.caller===null) A.appendChild(mkBtn('cabo', T.caboBtn, ()=>localAct('cabo'), !idle));
  if(G.phase==='holdDeck'||G.phase==='holdDiscard'){
    if(!UI.multi){ if(nLive(G.players[mySeat])>=2) A.appendChild(mkBtn('', T.multiBtn, ()=>{ UI.multi=true; UI.sel.clear(); render(); }, !idle)); }
    else {
      A.appendChild(mkBtn('', T.cancel, ()=>{ UI.multi=false; UI.sel.clear(); render(); }));
      A.appendChild(mkBtn('primary', T.confirmN(UI.sel.size), ()=>localAct('multi',null,mySeat,[...UI.sel]), !idle || UI.sel.size<2));
    }
  }
  if(G.phase==='power') A.appendChild(mkBtn('', T.skip, ()=>localAct('skip'), !idle));
}
function cardEl(c, opts={}){
  const d=document.createElement('div');
  if(opts.key) d.dataset.key=opts.key;
  if(c===null||c===undefined){ d.className='slot-empty'; return d; }
  if(opts.ghost){ d.className='card ghost'; return d; }
  if(typeof c==='number'){ d.className='card '+cls(c); d.innerHTML=faceHTML(c); }
  else if(c.gone){ d.className='card gone'; return d; }
  else if(opts.face!==undefined && opts.face!==null){ d.className='card '+cls(opts.face); d.innerHTML=faceHTML(opts.face); }
  else d.className='card back';
  if(opts.pick){ d.classList.add('pick'); d.tabIndex=0; d.setAttribute('role','button'); }
  if(opts.sel) d.classList.add('sel');
  if(opts.glow) d.classList.add('glow');
  if(opts.mem) d.classList.add('mem');
  return d;
}
function gridEl(p,pi){
  const g=document.createElement('div'); g.className='grid';
  const mine=pi===mySeat, idle=!busy(), myTurn=mySeat>=0 && G.current===mySeat, ph=G.phase;
  p.hand.forEach((c,i)=>{
    const key=slotKey(pi,i);
    let pick=false;
    if(idle && !c.gone){
      if(mine){
        if(ph==='initialPeek' && (G.ipk[mySeat]||[]).length<2 && !(G.ipk[mySeat]||[]).includes(i)) pick=true;
        if(myTurn && (ph==='holdDeck'||ph==='holdDiscard')) pick=true;
        if(myTurn && ph==='power' && (G.power==='peek'||G.power==='swap')) pick=true;
      } else if(myTurn && ph==='power'){
        if(G.power==='spy') pick=true;
        if(G.power==='swap' && UI.swapOwn!==null && pi!==G.caller) pick=true;
      }
    }
    let face=null;
    if(G.tempUp.has(key)) face=G.tempUp.get(key);
    else if(G.peekShow.has(key)) face=G.peekShow.get(key);
    else if(G.revealed && c.v!==null && c.v!==undefined) face=c.v;
    const sel = mine && ((UI.multi && UI.sel.has(i)) || (ph==='power' && G.power==='swap' && UI.swapOwn===i));
    const el=cardEl(c,{pick,key,ghost:G.hide.has(key),face,sel,glow:G.glow.has(key),mem:G.peekShow.has(key)&&!G.revealed});
    el.onclick=()=>clickSlot(pi,i);
    el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); clickSlot(pi,i); } };
    g.appendChild(el);
  });
  return g;
}

  head.append(nmEl, sm); return head;
}

  const held=$('#held'); held.innerHTML='';

  else held.appendChild((G.heldPub||myTurn) ? cardEl(G.held,{key:'held'}) : cardEl({gone:false},{key:'held'}));
  $('#heldLabel').textContent = G.held==null||G.current<0 ? T.inHand : (myTurn?T.inYourHand:T.inHandOf(nm(G.current)));

  if(MODE!=='solo' && net.code){ rt.hidden=false; rt.textContent=`${T.roomLabel}: ${net.code}`; } else rt.hidden=true;
  const max=Math.max(LIMIT,...G.players.map(p=>p.total));

    const bar=document.createElement('div'); bar.className='bar'; const fill=document.createElement('i'); fill.style.width=(Math.max(0,p.total)/max*100)+'%'; bar.appendChild(fill); sc.appendChild(bar);
  });

let six7Blob=null;
function six7Url(){
  if(!six7Blob){ const bin=atob(SIX7_B64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); six7Blob=new Blob([u],{type:'image/webp'}); }
  return URL.createObjectURL(six7Blob);
}
function showSixSeven(){
  const panel=$('#mine'); if(!panel || panel.hidden || !G) return;
  document.querySelectorAll('.sixSeven').forEach(e=>e.remove());
  const r=panel.getBoundingClientRect();
  const h=Math.max(160, Math.min(r.height-14, 380, innerHeight*0.6)), w=h*SIX7_W/SIX7_H;
  const url=six7Url(), img=new Image();
  img.className='sixSeven inward'; img.alt=''; img.draggable=false;
  Object.assign(img.style,{width:w+'px',height:h+'px',
    top:(r.top+scrollY+r.height/2-h/2)+'px',
    left:(r.right+scrollX-1-w)+'px'});
  const g=G;
  const end=()=>{ img.remove(); URL.revokeObjectURL(url); if(G===g){ G.ssUntil=0; render(); } };
  img.onload=()=>setTimeout(end, SIX7_MS+120);
  img.onerror=end;
  G.ssUntil=Date.now()+SIX7_MS+800; render();
  img.src=url;
  document.body.appendChild(img);
}
/* ---------- end-of-game finale (same as LuMa) ---------- */
let finRaf=null, finWin=false;
function stopFinale(){
  if(finRaf) cancelAnimationFrame(finRaf); finRaf=null;
  const f=$('#finale'); f.className=''; $('#hand').classList.remove('go');
}
function finaleText(){
  const T=L();
  $('#neonSign').textContent = finWin ? T.winnerSign : T.loserSign;
  $('#finaleBtn').textContent = T.seeScores;
}
function showFinale(win, onDone){
  finWin=win;
  const f=$('#finale');
  f.className='on '+(win?'win':'lose');
  const sign=$('#neonSign'); sign.className='neon '+(win?'blue':'red');
  void sign.offsetWidth;
  finaleText();
  const hand=$('#hand'); hand.classList.remove('go');
  if(!win){ void hand.offsetWidth; hand.classList.add('go'); }
  $('#finaleBtn').onclick=()=>{ stopFinale(); onDone&&onDone(); };
  runCanvas(win);
}
function runCanvas(win){
  const cv=$('#finCanvas'), ctx=cv.getContext('2d');
  const P=Math.PI;
  const resize=()=>{ const d=window.devicePixelRatio||1; cv.width=innerWidth*d; cv.height=innerHeight*d; };
  resize(); window.onresize=resize;
  const HUES=[195,285,330,50,160,220];
  const tiles=[]; const BANDS=16;
  for(let b=0;b<BANDS;b++){
    const la0=-P/2+b*P/BANDS, la1=la0+P/BANDS, lm=(la0+la1)/2;
    const n=Math.max(6, Math.round(34*Math.cos(lm)));
    for(let j=0;j<n;j++) tiles.push({la0,la1,lm,l0:j*2*P/n,l1:(j+1)*2*P/n,ph:Math.random()*50,ph2:Math.random()*50,hue:HUES[(Math.random()*HUES.length)|0]});
  }
  const spots=Array.from({length:80},()=>({a:Math.random()*2*P,y:Math.random(),r:5+Math.random()*13,hue:HUES[(Math.random()*HUES.length)|0],sp:0.7+Math.random()*0.6}));
  const drops=Array.from({length:120},()=>({x:Math.random(),y:Math.random(),v:0.25+Math.random()*0.35,l:10+Math.random()*18}));
  const t0=performance.now();
  const Ld=(()=>{const v=[-0.45,0.55,0.7];const m=Math.hypot(...v);return v.map(x=>x/m);})();
  function frame(now){
    const t=(now-t0)/1000, d=window.devicePixelRatio||1, W=cv.width/d, H=cv.height/d;
    ctx.setTransform(d,0,0,d,0,0);
    ctx.globalCompositeOperation='source-over';
    if(!win){
      ctx.fillStyle='#07080d'; ctx.fillRect(0,0,W,H);
      const g=ctx.createRadialGradient(W/2,H*0.55,10,W/2,H*0.55,Math.max(W,H)*0.55);
      g.addColorStop(0,'rgba(120,130,160,0.28)'); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      ctx.strokeStyle='rgba(170,180,210,0.22)'; ctx.lineWidth=1.2;
      ctx.beginPath();
      for(const r of drops){ r.y+=r.v*0.016; if(r.y>1.05){r.y=-0.05;r.x=Math.random();} const x=r.x*W,y=r.y*H; ctx.moveTo(x,y); ctx.lineTo(x-2,y+r.l); }
      ctx.stroke();
      finRaf=requestAnimationFrame(frame); return;
    }
    ctx.fillStyle='#06040f'; ctx.fillRect(0,0,W,H);
    const R=Math.min(W,H)*0.15, cx=W/2, target=H*0.52;
    const p=Math.min(1,t/2.6);
    const e=p<1 ? 1-Math.pow(1-p,3)*Math.cos(p*P*1.5) : 1;
    const cy=-R-30+(target+R+30)*Math.min(1.04,e);
    const sway=Math.sin(t*1.3)*R*0.03*Math.min(1,t/3);
    const bx=cx+sway;
    const rot=t*0.85;
    const lights=Math.max(0,Math.min(1,(t-2.3)/0.9));
    if(lights>0){
      ctx.globalCompositeOperation='lighter';
      const Lb=Math.hypot(W,H);
      for(let k=0;k<12;k++){
        const a=rot*0.7+k*2*P/12, w=0.035, hue=HUES[k%HUES.length];
        const gr=ctx.createRadialGradient(bx,cy,R*0.6,bx,cy,Lb);
        gr.addColorStop(0,`hsla(${hue},100%,70%,${0.22*lights})`); gr.addColorStop(1,`hsla(${hue},100%,60%,0)`);
        ctx.fillStyle=gr; ctx.beginPath(); ctx.moveTo(bx,cy);
        ctx.lineTo(bx+Math.cos(a-w)*Lb, cy+Math.sin(a-w)*Lb); ctx.lineTo(bx+Math.cos(a+w)*Lb, cy+Math.sin(a+w)*Lb); ctx.closePath(); ctx.fill();
      }
      for(const s of spots){
        const ang=s.a+rot*s.sp;
        const x=(((ang/(2*P))%1)+1)%1*W*1.3-W*0.15, y=s.y*H;
        const gr=ctx.createRadialGradient(x,y,0,x,y,s.r*2.2);
        gr.addColorStop(0,`hsla(${s.hue},100%,85%,${0.9*lights})`); gr.addColorStop(0.4,`hsla(${s.hue},100%,65%,${0.45*lights})`); gr.addColorStop(1,`hsla(${s.hue},100%,60%,0)`);
        ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(x,y,s.r*2.2,0,2*P); ctx.fill();
      }
      ctx.globalCompositeOperation='source-over';
    }
    ctx.strokeStyle='#b8bcc8'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(bx,cy-R); ctx.stroke();
    ctx.fillStyle='#8d92a3'; ctx.fillRect(bx-R*0.09,cy-R-R*0.12,R*0.18,R*0.16);
    ctx.fillStyle='#1d1f29'; ctx.beginPath(); ctx.arc(bx,cy,R,0,2*P); ctx.fill();
    const sparks=[];
    const pt=(la,lo)=>[bx+R*Math.cos(la)*Math.sin(lo), cy-R*Math.sin(la)];
    const ins=0.012;
    for(const tl of tiles){
      const lo0=tl.l0+rot+ins, lo1=tl.l1+rot-ins, mid=(lo0+lo1)/2;
      if(Math.cos(mid)<=0.02) continue;
      const nx=Math.cos(tl.lm)*Math.sin(mid), ny=Math.sin(tl.lm), nz=Math.cos(tl.lm)*Math.cos(mid);
      const dif=Math.max(0,nx*Ld[0]+ny*Ld[1]+nz*Ld[2]);
      const flash=Math.sin(t*5+tl.ph);
      let col;
      if(flash>0.985){ col='#ffffff'; sparks.push(pt(tl.lm,mid)); }
      else if(lights>0 && Math.sin(t*1.7+tl.ph2)>0.86) col=`hsl(${tl.hue},90%,${55+25*dif}%)`;
      else { const v=Math.round(55+170*dif*dif+20*nz); col=`rgb(${v},${v},${Math.min(255,v+12)})`; }
      const a=pt(tl.la0+ins,lo0), b=pt(tl.la0+ins,lo1), c=pt(tl.la1-ins,lo1), dd=pt(tl.la1-ins,lo0);
      ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.lineTo(c[0],c[1]); ctx.lineTo(dd[0],dd[1]); ctx.closePath(); ctx.fill();
    }
    const sh=ctx.createRadialGradient(bx-R*0.35,cy-R*0.4,R*0.05,bx,cy,R*1.02);
    sh.addColorStop(0,'rgba(255,255,255,0.22)'); sh.addColorStop(0.55,'rgba(255,255,255,0)'); sh.addColorStop(1,'rgba(0,0,0,0.55)');
    ctx.fillStyle=sh; ctx.beginPath(); ctx.arc(bx,cy,R,0,2*P); ctx.fill();
    ctx.globalCompositeOperation='lighter';
    for(const [x,y] of sparks){
      const s=R*0.28;
      const gr=ctx.createRadialGradient(x,y,0,x,y,s); gr.addColorStop(0,'rgba(255,255,255,.95)'); gr.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=gr; ctx.beginPath(); ctx.moveTo(x-s,y); ctx.lineTo(x,y-s*0.12); ctx.lineTo(x+s,y); ctx.lineTo(x,y+s*0.12); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x,y-s); ctx.lineTo(x+s*0.12,y); ctx.lineTo(x,y+s); ctx.lineTo(x-s*0.12,y); ctx.closePath(); ctx.fill();
    }
    ctx.globalCompositeOperation='source-over';
    finRaf=requestAnimationFrame(frame);
  }
  if(finRaf) cancelAnimationFrame(finRaf);
  finRaf=requestAnimationFrame(frame);
}

applyStatic();
initRoom();
show('home');
})();
</script>
