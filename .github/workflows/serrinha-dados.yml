name: Dados da Serrinha (mapa, relevo, cobertura)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/serrinha-dados.yml', '.github/scripts/serrinha_dados.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow rasterio
      - run: python .github/scripts/serrinha_dados.py
      - name: Salva no branch dados-serrinha
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp -r serrinha-dados /tmp/serrinha-dados
          git checkout --orphan dados-serrinha
          git rm -rfq .
          cp -r /tmp/serrinha-dados .
          git add serrinha-dados
          git commit -qm "Dados da Serrinha do Alambari (OSM, relevo, cobertura)"
          git push -f origin dados-serrinha
